<div class="main-view">
  <span class="forecast-day">
    {{ dayData().isToday ? 'Now' : ((dayData().date | date: 'EE')) }}
  </span>

  <div class="forecast">
    <span class="forecast-icon">
      <img [src]="imagePath(dayData().weatherCode)"
           alt="Current conditions">
      <!--      <div class="background"></div>    -->
    </span>

    <div class="main-info-wrapper">
      <div class="conditions">
        {{ dayData().conditions }}
      </div>

      <div class="loHi">
          <span class="graph-num"
                [class.negative]="dayData().minTemperature <= -1">{{ dayData().minTemperature }}°</span>
        <div class="bar-container">
          <div class="bar-fill"
               [style.width.%]="graphFillWidth()"
               [style.left.%]="graphFillOffset()"></div>
        </div>
        <span class="graph-num"
              [class.negative]="dayData().maxTemperature <= -1">{{ dayData().maxTemperature }}</span>
      </div>
    </div>
  </div>

  <span (click)="onToggleDetails()"
        class="expander">
    <svg xmlns="http://www.w3.org/2000/svg"
         width="24"
         height="24"
         viewBox="0 0 24 24"
         fill="none"
         stroke="#34477f"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"
         class="arrow" [class.arrow-expanded]="onExpandView()"><path d="m6 9 6 6 6-6" /></svg>
  </span>
</div>

@if (onExpandView()) {
  <div class="expanded-view">
    <div>
      <span class="emphasized">Precipitation: </span><span>{{ dayData().precipitation }}%
              </span>
    </div>
    <div>
      <span class="emphasized">UV Index: </span>{{ dayData().uvMax | number: '1.0-0' }}
    </div>
  </div>
}

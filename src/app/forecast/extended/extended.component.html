<div class="extended-group">
  <h5 class="card-title extended-title">7-DAY FORECAST</h5>

  @for (dayData of extendedData(); track dayData.date) {
    <app-extended-card [dayData]="dayData"
                       [extendedMinTemp]="extendedMinTemp()"
                       [extendedMaxTemp]="extendedMaxTemp()"
                       [extendedRange]="extendedRange()"/>
  }
</div>

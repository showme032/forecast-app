@if (weatherData()) {
  <div class="forecast-wrapper" [@animateElement]>
    <!--  Current weather conditions  -->
    <div class="wrapper current-wrapper">
      <app-current [location]="location()" [weatherData]="weatherData()"/>
    </div>

    <!--  Hourly temperatures  -->
    <div class="hourly-wrapper">
      <app-hourly [weatherData]="weatherData()" />
    </div>

    <!--  Today's conditions  -->
    <div class="wrapper today-wrapper">
      <app-today [weatherData]="weatherData()"
        [airQualityIndex]="airQualityIndex()" />
    </div>

    <!--  7-day Forecast  -->
    <div class="extended-wrapper">
      <app-extended [weatherData]="weatherData()"/>
    </div>
  </div>
}
